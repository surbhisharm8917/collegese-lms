name: Cleanup GHCR Packages

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  # Allow manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old GHCR images (keep latest 5)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packages = [
              'just-easy-ca-backend',
              'just-easy-ca-frontend',
            ];
            const KEEP = 5;

            for (const pkg of packages) {
              core.info(`Cleaning package: ${pkg}`);

              const versions = await github.paginate(
                github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                {
                  package_type: 'container',
                  package_name: pkg,
                  username: owner,
                  per_page: 100,
                }
              );

              if (!versions.length) {
                core.info(`No versions found for ${pkg}`);
                continue;
              }

              // Newest first
              const sorted = versions.sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at)
              );

              const toDelete = sorted.slice(KEEP);

              core.info(
                `Keeping ${Math.min(KEEP, sorted.length)} newest versions for ${pkg}, deleting ${toDelete.length}`
              );

              for (const v of toDelete) {
                core.info(
                  `Deleting ${pkg} version id=${v.id}, created_at=${v.created_at}, tags=${JSON.stringify(
                    v.metadata?.container?.tags || []
                  )}`
                );

                await github.rest.packages.deletePackageVersionForUser({
                  package_type: 'container',
                  package_name: pkg,
                  username: owner,
                  package_version_id: v.id,
                });
              }
            }
